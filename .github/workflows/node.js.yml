name: CI - Client (Game)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x] # LTS Version

    steps:
    - uses: actions/checkout@v4

    - name: Check Node.js project files
      id: project-files
      run: |
        if [ -f package.json ] && [ -f package-lock.json ]; then
          echo "has-node-project=true" >> "$GITHUB_OUTPUT"
        else
          echo "has-node-project=false" >> "$GITHUB_OUTPUT"
          echo "No package.json/package-lock.json found. Skipping Node.js build and test steps."
        fi

    - name: Setup Node.js ${{ matrix.node-version }}
      if: steps.project-files.outputs.has-node-project == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm' # cache for faster dependence download

    - name: Install dependencies
      if: steps.project-files.outputs.has-node-project == 'true'
      run: npm ci

    - name: Linting (Code Quality)
      if: steps.project-files.outputs.has-node-project == 'true'
      run: npm run lint # Assurez-vous d'avoir un script "lint" dans package.json

    - name: Type Checking (TypeScript)
      if: steps.project-files.outputs.has-node-project == 'true'
      run: npm run type-check # Si vous utilisez tsc --noEmit

    - name: Run Tests
      if: steps.project-files.outputs.has-node-project == 'true'
      run: npm test # Lance vos tests unitaires (Jest/Vitest)

    - name: Build Project
      if: steps.project-files.outputs.has-node-project == 'true'
      run: npm run build # Vérifie que le jeu compile sans erreur (ex: Vite/Webpack)
      
    # Optionnel : Upload des artefacts de build pour déploiement futur
    - name: Upload Build Artifacts
      if: steps.project-files.outputs.has-node-project == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: client-build
        path: dist/ # Adaptez selon votre dossier de sortie (ex: build, public)
